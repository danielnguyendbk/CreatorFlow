spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/creatorflow}
    username: ${DB_USER:creatorflow}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB
server:
  port: ${PORT:8080}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
creatorflow:
  api-token: ${CREATORFLOW_API_TOKEN:}
